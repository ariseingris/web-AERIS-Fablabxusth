version: '3.8'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AI_SERVICE_URL=http://ai-service:5001
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  client:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_KEY=${VITE_SUPABASE_KEY}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - api
      - ai-service

  ai-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.ai
    ports:
      - "5001:5001"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ALLOWED_ORIGIN=http://localhost:5173
      - FLASK_DEBUG=true
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - ./backend:/app